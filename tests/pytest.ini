[pytest]
# This file lives in tests/ on purpose: the repo root is itself the plugin package (it
# has an __init__.py with relative imports). With the ini at the root, pytest would
# collect the root as a package and import __init__.py outside any parent package.
# Run as `pytest tests` so rootdir resolves here.
addopts = --import-mode=importlib -q -p no:cacheprovider
testpaths = .
