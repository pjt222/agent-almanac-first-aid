[pytest]
# This file lives in tests/ on purpose. The repo root is the plugin package (it has an
# __init__.py with relative imports), and its directory name, agent-almanac-first-aid,
# is not a valid Python package name. With the ini at the root, pytest collects the root
# directory as a package, cannot name it, and imports __init__.py without a parent
# package: every test errors with "attempted relative import with no known parent
# package". Measured 2026-11-05: 12 errors in a directory named agent-almanac-first-aid,
# 12 passes in one named plainname. Run as `pytest tests` so rootdir resolves here.
addopts = --import-mode=importlib -q -p no:cacheprovider
testpaths = .
