name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest Python the plugin guide's examples target; 3.14 is what
        # Hermes v0.22.7 ships with.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install 'pytest>=8,<9'

      - name: Unit tests
        run: python -m pytest tests

      - name: Fetch agent-almanac at the pinned commit
        run: |
          almanac_commit=$(python -c 'import json; print(json.load(open("skills/PROVENANCE.json"))["commit"])')
          git init -q "$RUNNER_TEMP/agent-almanac"
          git -C "$RUNNER_TEMP/agent-almanac" fetch -q --depth 1 https://github.com/pjt222/agent-almanac.git "$almanac_commit"

      - name: Vendored kit matches PROVENANCE.json and re-derives from its source
        run: python scripts/sync_kit.py --verify-source "$RUNNER_TEMP/agent-almanac"
